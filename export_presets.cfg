[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="levels_lib/*, demo/mods/*, 变体规则编写规范.md"
exclude_filter="test/*, tools/*, archive/*, screenshots/*, docs/*, _staged_levels/*, demo/web/*, demo/test.gd, demo/test.tscn, addons/gut/*, addons/dialogue_manager/*, addons/godot_mcp/*, addons/godot_ai/*, sast_*"
; 【09-28 审计修复 A1】原先 exclude_filter="" + export_filter="all_resources" ⇒ 把 test/（含 GUT 用例）、
; tools/（含 56KB 量产工具）、archive/、screenshots/、未使用的 addon 全部打进包。
; 保留 **addons/godot_ai** 与 **addons/debug_menu**：它们是 project.godot 里注册的 autoload，
; 从包里剔除会导致导出版启动报"autoload 路径不存在"；改为在代码里做发布门控（见 game_helper.gd / debug_menu.gd）。
; 保留 addons/godotsteam、godot-wasm（构建链使用）。
; ⚠ 刻意**不**排除 `*.md`：include_filter 明确列了 `变体规则编写规范.md`（游戏内要读它），
;   排除通配会把它一起干掉。
export_path="../builds/世界扫雷.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/identity=""
codesign/password=""
