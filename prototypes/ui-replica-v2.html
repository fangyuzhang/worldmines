<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldMines · UI 重组方案 v2（按出现时机分层）</title>
<!--
  ============================================================================
  重 组 说 明 —— 这不是"美化"，是换一套交互架构
  ----------------------------------------------------------------------------
  【诊断】旧架构按「实现类型」分组：顶栏 / 右侧列 / 底栏 / 独立页 / 弹窗。
          结果：一个功能放哪取决于**它是什么**，而不是**玩家什么时候需要它**。
          代价：
            · 顶栏 64px 里塞了 logo+面包屑+6 个导航 —— 而玩家 90% 时间在对局，
              导航是"最贵的位置装最不需要的东西"
            · 右侧列 104px 常驻只为 3 个按钮，其中 2 个（撤销/暂停）中局才用
            · 「当前变体规则」要**离开对局**去图鉴查 —— 最痛的一条
            · 设置是独立页，改主题时**看不到棋盘**，只能盲调
            · 结算用弹窗盖住棋盘 —— 玩家没机会看自己是怎么输的

  【重排原则】按「出现时机」分四层，而不是按类型分位置：
      L0 场景层  永远在    棋盘本身
      L1 数据层  永远在    一条 40px 读数带（只有数据，没有 logo 没有导航）
      L2 意图层  随状态变  底部上下文条：只显示"此刻能做的事"
      L3 查阅层  我要看时  左拉手=全局导航 / 右拉手=本局信息（就地覆盖，状态不丢）
      L4 打断层  必须处理  只有结算与确认 —— 且结算**不再遮挡棋盘**

  【打乱重组的 7 个动作】
    ① 顶栏 64→40：撤掉 logo/面包屑/导航，只留数据（棋盘 +12%）
    ② 导航从顶栏搬到「左拉手」抽屉：对局状态永不因切页丢失
    ③ 右侧列 104px 撤销 → 工具进「上下文条」，按状态增删
    ④ 变体规则从图鉴拆出 → 「右拉手」常驻，边玩边看，不用离开对局
    ⑤ 设置从独立页 → 「右拉手」里的就地开关，改主题**看着棋盘调**
    ⑥ 结算从弹窗 → 棋盘下方「结果带」，不遮挡，能复盘
    ⑦ 宠物从纯装饰 → 状态指示（平静 / 紧张 / 难过 / 开心）

  【保留】已验证的玩法逻辑（首点安全 / 洪泛 / chord / 胜负 / 撤销）—— 一字未改。
  ============================================================================
-->
<style>
/* ============================ 主题色板（照抄 theme_manager.gd） ============================ */
:root{
  --bg:#b7c9d4; --card:#cbf5fc; --sunken:#a8bccb; --cell-hidden:#ccdee6; --cell-revealed:#b7c9d4;
  --text:#444d5b; --text2:#5b6471; --accent:#3471a1; --accent-text:#edfafd;
  --danger:#c92a16; --safe:#1f5c40; --mat:#526685;
  --line:rgba(113,134,166,.34); --pet-fur:#7b889d; --pet-ink:#353d4a;
  --pet-nose:#b04c71; --pet-leaf:#43af7d;
  --n1:#3471a1; --n2:#1f5c40; --n3:#c92a16; --n4:#5b6471;
  --n5:#8a5a3c; --n6:#2f7f8f; --n7:#444d5b; --n8:#7a4b96;
  --sh:rgba(20,38,48,.30); --sh2:rgba(20,38,48,.18);
  --font:"WenYuanRoundedSCVF","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
.app[data-theme="cozy_terracotta"]{
  --bg:#d3c1b2; --card:#f9cbba; --sunken:#c3ac9c; --cell-hidden:#ebdecd; --cell-revealed:#d3c1b2;
  --text:#564842; --text2:#665a55; --accent:#9a5b32; --accent-text:#fff3ec;
  --danger:#c33016; --safe:#1e5a3e; --mat:#7d5c56; --pet-fur:#97807c; --pet-ink:#43383a;
  --pet-nose:#ae4a6f; --pet-leaf:#42ad7b; --line:rgba(125,92,86,.30);
  --n1:#9a5b32; --n2:#1e5a3e; --n3:#c33016; --n4:#665a55;
  --n5:#8a4a24; --n6:#2c6f7c; --n7:#564842; --n8:#7a4b96;
}
.app[data-theme="cozy_sage"]{
  --bg:#bbd4c8; --card:#c3faee; --sunken:#a6c3b5; --cell-hidden:#cee4d8; --cell-revealed:#bbd4c8;
  --text:#445454; --text2:#5c6c6b; --accent:#2e7f67; --accent-text:#effffb;
  --danger:#d42c18; --safe:#216244; --mat:#516f77; --pet-fur:#7b9197; --pet-ink:#364448;
  --pet-nose:#ac5e4a; --pet-leaf:#45b782; --line:rgba(116,151,159,.34);
  --n1:#2e7f67; --n2:#216244; --n3:#d42c18; --n4:#5c6c6b;
  --n5:#8a5a3c; --n6:#2f7f8f; --n7:#445454; --n8:#7a4b96;
}
.app[data-theme="cozy_dusk"]{
  --bg:#c2bad6; --card:#eedffc; --sunken:#ab9fc4; --cell-hidden:#d5cfe8; --cell-revealed:#c2bad6;
  --text:#4d4357; --text2:#645a6d; --accent:#7f4bc2; --accent-text:#f8f1ff;
  --danger:#be2815; --safe:#1d563c; --mat:#745385; --pet-fur:#8f789b; --pet-ink:#3b3243;
  --pet-nose:#a6476a; --pet-leaf:#40a778; --line:rgba(116,83,133,.30);
  --n1:#7f4bc2; --n2:#1d563c; --n3:#be2815; --n4:#645a6d;
  --n5:#8a5a3c; --n6:#2f6f8f; --n7:#4d4357; --n8:#a03d7a;
}
.app[data-theme="dark"]{
  --bg:#1E1E24; --card:#28282E; --sunken:#141418; --cell-hidden:#3A3A42; --cell-revealed:#232328;
  --text:#E0E0E6; --text2:#888892; --accent:#7CB9E8; --accent-text:#10202c;
  --danger:#C0504D; --safe:#4EA96B; --mat:#1a1c22; --line:rgba(255,255,255,.10);
  --pet-fur:#5d6472; --pet-ink:#c9cdd6; --pet-nose:#b5566f; --pet-leaf:#3f9c75;
  --n1:#7CB9E8; --n2:#4EA96B; --n3:#E0706A; --n4:#A0A0AC;
  --n5:#D9A05B; --n6:#5BC8D9; --n7:#C7C7D2; --n8:#C08BE0;
  --sh:rgba(0,0,0,.55); --sh2:rgba(0,0,0,.35);
}

/* ============================ 基础 ============================ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#5d6873;display:grid;place-items:center;font-family:var(--font);color:var(--text);
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}

.app{position:relative;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;
  width:min(1280px,97vw);height:min(720px,94vh)}
button:focus-visible,.pull:focus-visible,.card:focus-visible,.tab:focus-visible,
.pitem:focus-visible,.chip:focus-visible,.seg button:focus-visible,.sw:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px}

/* ============================ L1 数据层：40px 读数带（无 logo / 无导航） ============================ */
.readout{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:10px;padding:0 14px;
  position:relative;z-index:6}
.rd{display:flex;align-items:center;gap:6px;font-size:15px;font-variant-numeric:tabular-nums;
  color:var(--text)}
.rd svg{width:18px;height:18px;opacity:.8}
.rd .v{font-weight:700}
.rd.dim{color:var(--text2)}
.rd.dim .v{font-weight:600}
.rdbar-sep{width:1px;height:16px;background:var(--line)}
.rdbar-spacer{flex:1}
/* 进度条：把"翻开了多少"变成可扫的一条线，而不是一对数字 */
.progline{width:132px;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.progline i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
  transition:width .25s}

/* ============================ L0 场景层：棋盘区（最大化） ============================ */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;
  padding:0 34px}
.boardzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-width:0;min-height:0;flex:1;position:relative}
.mat{position:relative;padding:11px;border-radius:16px;background:var(--mat);
  box-shadow:0 9px 26px var(--sh), inset 0 1px 0 rgba(255,255,255,.18)}
.grid{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  gap:calc(var(--cell) * .064);width:calc(var(--cell) * 9);height:calc(var(--cell) * 9)}
.tile{border-radius:calc(var(--cell) * .106);display:grid;place-items:center;
  font-size:calc(var(--cell) * .56);font-weight:700;line-height:1;user-select:none;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 42%),var(--cell-hidden);
  box-shadow:0 2px 0 var(--sh2),0 3px 6px var(--sh2), inset 0 1px 0 rgba(255,255,255,.75);
  transition:transform .08s,box-shadow .12s}
.tile:not(.open):hover{transform:translateY(-1.5px)}
.tile.open{background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0) 45%),var(--cell-revealed);
  box-shadow:inset 0 2px 4px var(--sh2);cursor:default;transform:none}
.tile.open[class*="t"]{cursor:pointer}
.tile.cur{box-shadow:0 0 0 3px var(--accent),0 0 0 5px var(--bg) inset;z-index:2}
.tile.pop{animation:pop .22s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.tile.boomhit{background:var(--danger)!important;color:#fff;animation:boom .45s}
.tile.hl{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.tile svg{width:62%;height:62%}
.t1{color:var(--n1)}.t2{color:var(--n2)}.t3{color:var(--n3)}.t4{color:var(--n4)}
.t5{color:var(--n5)}.t6{color:var(--n6)}.t7{color:var(--n7)}.t8{color:var(--n8)}

/* 开局操作提示（首次操作后消失） */
.hintbar{font-size:12.5px;color:var(--text2);background:var(--card);padding:6px 13px;
  border-radius:999px;box-shadow:0 2px 0 var(--sh2);white-space:nowrap;transition:opacity .3s}
.hintbar b{color:var(--text)}
.hintbar.off{opacity:0;pointer-events:none;height:0;padding:0;margin:0;overflow:hidden}

/* ★ 结算不再用弹窗：棋盘下方展开一条结果带 —— 能看着盘面复盘自己怎么输的 */
.resultbar{display:none;align-items:center;gap:14px;background:var(--card);border-radius:14px;
  padding:11px 16px;box-shadow:0 4px 0 var(--sh2),0 8px 20px var(--sh2);animation:slideup .28s ease-out}
.resultbar.on{display:flex}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.resultbar .big{font-size:21px;font-weight:800;min-width:66px}
.resultbar .big.win{color:var(--safe)} .resultbar .big.lose{color:var(--danger)}
.resultbar .meta{font-size:13.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.resultbar .acts{margin-left:auto;display:flex;gap:8px}

/* 宠物 = 状态指示（不再是纯装饰） */
.pet{position:absolute;left:-22px;bottom:-18px;width:118px;height:92px;pointer-events:none;z-index:1;
  transition:transform .3s,filter .3s}
.pet .shadow{position:absolute;bottom:2px;left:22px;width:74px;height:11px;border-radius:50%;
  background:var(--sh2);filter:blur(5px)}
.pet .tail{position:absolute;left:6px;bottom:22px;width:10px;height:40px;border-radius:6px;
  background:var(--pet-fur);transform:rotate(-24deg);transition:transform .3s}
.pet .body{position:absolute;left:22px;bottom:8px;width:74px;height:53px;border-radius:27px;
  background:var(--pet-fur)}
.pet .head{position:absolute;left:20px;bottom:41px;width:78px;height:52px;border-radius:29px;
  background:var(--pet-fur)}
.pet .ear{position:absolute;bottom:82px;width:18px;height:18px;border-radius:50% 50% 4px 4px;
  background:var(--pet-fur);transition:transform .3s}
.pet .ear.l{left:27px;transform:rotate(-14deg)} .pet .ear.r{left:69px;transform:rotate(14deg)}
.pet .eye{position:absolute;bottom:64px;width:8px;height:8px;border-radius:50%;background:var(--pet-ink);
  transition:height .3s,border-radius .3s}
.pet .eye.l{left:38px} .pet .eye.r{left:69px}
.pet .muzzle{position:absolute;bottom:52px;left:51px;width:16px;height:12px;border-radius:50%;
  background:var(--pet-nose)}
.pet .leaf{position:absolute;bottom:98px;left:54px;width:11px;height:11px;
  border-radius:50% 4px 50% 4px;background:var(--pet-leaf);transform:rotate(-18deg);
  transition:transform .3s,opacity .3s;opacity:0}
/* 状态：紧张（刚开始/危险）· 难过（踩雷）· 开心（胜利） */
.pet.tight .tail{transform:rotate(-8deg)}
.pet.sad{filter:saturate(.55) brightness(.92);transform:translateY(3px)}
.pet.sad .ear.l{transform:rotate(-42deg)} .pet.sad .ear.r{transform:rotate(42deg)}
.pet.happy .leaf{opacity:1;transform:rotate(-18deg) scale(1.25)}
.pet.happy{transform:translateY(-4px)}

/* 左右拉手：把"最贵的位置"还给棋盘，导航收进边缘 */
.pull{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:96px;
  border-radius:12px;background:var(--card);color:var(--accent);display:grid;place-items:center;
  box-shadow:0 3px 10px var(--sh2);z-index:8;transition:transform .15s,width .15s}
.pull:hover{width:32px}
.pull-l{left:2px} .pull-r{right:2px}
.pull svg{width:17px;height:17px}
.pull .dot{position:absolute;top:9px;right:6px;width:6px;height:6px;border-radius:50%;
  background:var(--danger);opacity:0;transition:opacity .2s}
.pull.has .dot{opacity:1}

/* ============================ L2 意图层：上下文工具条 ============================ */
.ctxbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:9px;padding:0 16px;
  position:relative;z-index:6;overflow-x:auto;scrollbar-width:none}
.ctxbar::-webkit-scrollbar{display:none}
.ctxbar .lead{font-size:12.5px;color:var(--text2);margin-right:2px;white-space:nowrap}
.act{height:40px;padding:0 15px;border-radius:12px;background:var(--card);font-size:14.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;box-shadow:0 2px 0 var(--sh2);white-space:nowrap;
  transition:transform .12s,background .12s,color .12s}
.act svg{width:18px;height:18px}
.act:hover{transform:translateY(-1px);background:var(--accent);color:var(--accent-text)}
.act:active{transform:translateY(1px)}
.act.primary{background:var(--accent);color:var(--accent-text)}
.act.danger{background:var(--danger);color:#fff}
.act[disabled]{opacity:.42;pointer-events:none}
.act kbd{font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--sunken);color:var(--text2)}
.act:hover kbd{background:rgba(255,255,255,.22);color:inherit}
.act .cnt{font-size:11.5px;opacity:.7}
.sw{width:24px;height:24px;border-radius:8px;cursor:pointer;
  box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--sh2);transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.seg{display:inline-flex;background:var(--sunken);border-radius:11px;padding:3px;gap:3px}
.seg button{height:30px;padding:0 12px;border-radius:9px;font-size:13.5px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:700}

/* ============================ L3 查阅层：拉手抽屉 ============================ */
.scrim{position:absolute;inset:0;background:rgba(12,20,26,.40);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:absolute;top:0;height:100%;width:min(390px,60%);background:var(--card);
  z-index:40;display:flex;flex-direction:column;padding:16px 16px 14px;
  transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 40px var(--sh)}
.panel-l{left:0;transform:translateX(-102%)}
.panel-r{right:0;transform:translateX(102%)}
.panel.on{transform:translateX(0)}
.panel h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.panel .close{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--sunken);color:var(--text2)}
.panel .close:hover{background:var(--accent);color:var(--accent-text)}
.panel .body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.panel .body::-webkit-scrollbar{width:9px}
.panel .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.pgrp{font-size:12px;color:var(--text2);padding:10px 8px 2px}

/* 左拉手：全局导航项 */
.nav-item{display:flex;align-items:center;gap:11px;height:46px;padding:0 13px;border-radius:12px;
  font-size:15.5px;color:var(--text);text-align:left;transition:background .13s,transform .13s}
.nav-item svg{width:20px;height:20px;color:var(--accent);flex:0 0 20px}
.nav-item:hover{background:var(--sunken);transform:translateX(3px)}
.nav-item[aria-current="page"]{background:var(--accent);color:var(--accent-text)}
.nav-item[aria-current="page"] svg{color:var(--accent-text)}
.nav-item small{margin-left:auto;font-size:12px;opacity:.7}

/* 右拉手：本局信息 */
.rulebox{background:var(--sunken);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.rulebox .k{font-size:11.5px;color:var(--text2);margin-bottom:4px}
.rulebox b{color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv .c{background:var(--sunken);border-radius:11px;padding:9px 12px}
.kv .c .k{font-size:11.5px;color:var(--text2)}
.kv .c .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 4px}
.frow .lab{font-size:14px}
.sw-inline{width:44px;height:26px;border-radius:99px;background:var(--sunken);position:relative;
  cursor:pointer;flex:0 0 44px;transition:background .16s;box-shadow:inset 0 1px 3px var(--sh2)}
.sw-inline::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--card);transition:transform .16s;box-shadow:0 1px 3px var(--sh2)}
.sw-inline[aria-checked="true"]{background:var(--accent)}
.sw-inline[aria-checked="true"]::after{transform:translateX(18px)}
select{height:34px;padding:0 9px;border-radius:9px;border:1px solid var(--line);
  background:var(--sunken);font-size:13.5px}

/* ============================ 内嵌页面（不离开对局，状态不丢） ============================ */
.pageview{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;
  flex-direction:column;padding:14px 20px 18px}
.pageview.on{display:flex}
.pvhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pvhead h1{margin:0;font-size:22px}
.pvhead .sub{font-size:13px;color:var(--text2);margin-top:3px}
.pvhead .back{margin-left:auto;display:flex;gap:8px}
.pvbody{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start}
.cards{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
.card{background:var(--card);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 3px 0 var(--sh2);cursor:pointer;text-align:left;position:relative;
  transition:transform .13s,box-shadow .13s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--sh2),0 9px 20px var(--sh)}
.card[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.card .ttl{font-size:15.5px;font-weight:700}
.card .desc{font-size:12.5px;color:var(--text2);line-height:1.45}
.card .foot{margin-top:auto;display:flex;gap:8px;font-size:12px;color:var(--text2)}
.card .corner{position:absolute;top:9px;right:9px;font-size:10.5px;padding:2px 7px;border-radius:6px;
  background:var(--accent);color:var(--accent-text);font-weight:700}
.card .corner.warn{background:var(--danger);color:#fff}
.card.locked{opacity:.6;filter:saturate(.6)}
.split{display:flex;gap:16px;min-height:0;flex:1}
.side{width:210px;flex:0 0 210px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.side .item{height:38px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--text2);
  text-align:left;display:flex;align-items:center}
.side .item:hover{background:var(--card);color:var(--text)}
.side .item[aria-selected="true"]{background:var(--card);color:var(--text);font-weight:700}
.side .grp{font-size:11.5px;color:var(--text2);padding:10px 12px 2px;opacity:.8}
.detail{flex:1;min-width:0;overflow:auto;background:var(--card);border-radius:14px;padding:18px 20px}
.detail h2{margin:0 0 6px;font-size:19px}
.detail h3{margin:16px 0 7px;font-size:14.5px;color:var(--text2)}
.detail p{margin:0 0 9px;font-size:14px;line-height:1.7}
.detail code{background:var(--sunken);padding:2px 6px;border-radius:5px;font-size:12.5px}
.xtable{display:grid;gap:5px;grid-template-columns:auto repeat(7,minmax(0,1fr))}
.xtable .h{font-size:11.5px;color:var(--text2);display:grid;place-items:center;padding:4px}
.xtable .cell{aspect-ratio:1.6;border-radius:9px;background:var(--card);display:grid;place-items:center;
  font-size:11.5px;cursor:pointer;box-shadow:0 2px 0 var(--sh2)}
.xtable .cell:hover{background:var(--accent);color:var(--accent-text)}
.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tab{height:35px;padding:0 14px;border-radius:10px;font-size:14px;color:var(--text2)}
.tab:hover{background:var(--card)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-text);font-weight:700}
.empty{display:grid;place-items:center;gap:10px;padding:40px;color:var(--text2);text-align:center}
.empty .big{font-size:38px;opacity:.5}

/* ============================ L4 打断层：只剩确认 ============================ */
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
  background:var(--card);border-radius:16px;box-shadow:0 20px 46px var(--sh);z-index:50;
  width:min(400px,88%);padding:22px 24px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h2{margin:0 0 6px;font-size:20px}
.modal .sub{font-size:13.5px;color:var(--text2)}
.modal .btnrow{display:flex;gap:9px;justify-content:center;margin-top:18px}
.gbar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:12px}
.gbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,14px);opacity:0;
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13.5px;
  font-weight:600;z-index:60;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:.95;transform:translate(-50%,0)}
/* 窄窗时宠物让位给棋盘（纯装饰，不该抢地方） */
@media (max-width:900px){.pet{display:none}}
</style>
</head>
<body>

<div class="app" id="app" data-theme="cozy_salt" data-screen="game">

  <!-- ============ L1 数据层：只有数据，没有 logo / 面包屑 / 导航 ============ -->
  <div class="readout">
    <div class="rd" title="剩余雷数（插旗超了会变红）">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5.4"/><path d="M12 1.6v3.4M12 19v3.4M1.6 12h3.4M19 12h3.4M4.6 4.6l2.4 2.4M17 17l2.4 2.4M19.4 4.6L17 7M7 17l-2.4 2.4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
      <span class="v" id="mineCount">10</span></div>
    <span class="rdbar-sep"></span>
    <div class="rd" title="用时">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12.6" r="8.4"/><path d="M12 7.8v4.8l3 2M9 2.4h6"/></svg>
      <span class="v" id="timeText">00:00</span></div>
    <span class="rdbar-sep"></span>
    <div class="rd dim" title="当前盘面下仍能被纯逻辑推出的安全格数">
      <span class="v" id="deducible">3</span><span>可断定</span></div>
    <span class="rdbar-spacer"></span>
    <div class="rd dim" id="variantTag" title="当前变体">经典 · 9×9</div>
    <div class="progline" title="翻开进度"><i id="progFill"></i></div>
    <div class="rd dim"><span class="v" id="progText">0/71</span></div>
  </div>

  <!-- ============ L0 场景层 ============ -->
  <div class="stage">
    <button class="pull pull-l" id="pullL" title="打开导航（全局）">
      <span class="dot" id="dotL"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <div class="boardzone">
      <div class="pet calm" id="pet">
        <div class="shadow"></div><div class="tail"></div><div class="body"></div><div class="head"></div>
        <div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div>
        <div class="muzzle"></div><div class="leaf"></div>
      </div>
      <div class="hintbar" id="hintbar">
        <b>左键</b>翻开 · <b>右键/F</b>插旗 · <b>点数字</b>快捷展开 · <b>方向键</b>走格 · <b>H</b>提示
      </div>
      <div class="mat"><div class="grid" id="grid"></div></div>
      <div class="resultbar" id="resultbar">
        <span class="big win" id="rsBig">胜利！</span>
        <span class="meta" id="rsMeta">用时 02:41 · 翻开 71 格 · 提示 0 次</span>
        <span class="acts">
          <button class="act" id="rsReview">看盘面</button>
          <button class="act" id="rsNext">下一关</button>
          <button class="act primary" id="rsAgain">再来一局</button>
        </span>
      </div>
    </div>

    <button class="pull pull-r" id="pullR" title="打开本局面板">
      <span class="dot" id="dotR"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>

  <!-- ============ L2 意图层：只显示"此刻能做的事"，随状态重建 ============ -->
  <div class="ctxbar" id="ctxbar"></div>

  <!-- ============ L3 查阅层：左拉手 = 全局导航 ============ -->
  <aside class="panel panel-l" id="panelL">
    <h2>导航
      <button class="close" data-close title="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </h2>
    <div class="body" id="navBody"></div>
  </aside>

  <!-- ============ L3 查阅层：右拉手 = 本局信息（就地改，看着棋盘调） ============ -->
  <aside class="panel panel-r" id="panelR">
    <h2>本局
      <button class="close" data-close title="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </h2>
    <div class="body" id="roundBody"></div>
  </aside>

  <!-- ============ 内嵌页面（覆盖棋盘，但**不重置对局**） ============ -->
  <section class="pageview" id="pv">
    <div class="pvhead">
      <div><h1 id="pvTitle">关卡</h1><div class="sub" id="pvSub">—</div></div>
      <div class="back">
        <button class="act" id="pvBack">← 回到对局</button>
      </div>
    </div>
    <div class="pvbody" id="pvBody"></div>
  </section>

  <div class="scrim" id="scrim"></div>

  <!-- ============ L4 打断层：只剩确认/生成 ============ -->
  <div class="modal" id="mConfirm">
    <h2 id="cfTitle">确定要重新开始吗？</h2>
    <div class="sub" id="cfSub">当前进度会丢失</div>
    <div class="btnrow">
      <button class="act" data-close>取消</button>
      <button class="act danger" id="cfOk">确定</button>
    </div>
  </div>

  <div class="modal" id="mGen">
    <h2>正在生成关卡</h2>
    <div class="sub" id="genSub">尝试 0 / 40 · 普通档</div>
    <div class="gbar"><i id="genBar"></i></div>
    <div class="btnrow"><button class="act" data-close>取消生成</button></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================================
   0) 工具
   ========================================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=n=>Math.floor(Math.random()*n);
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}

const ICON={
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 21V4"/><path d="M6 4.6h10.4l-1.8 3.4 1.8 3.4H6z" fill="currentColor" stroke="none"/></svg>',
  mine:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12.6" r="5.6"/><path d="M12 1.6v3.2M12 20.4v3.2M1.6 12.6h3.2M19.2 12.6h3.2M4.6 5.2l2.3 2.3M17.1 17.7l2.3 2.3M19.4 5.2l-2.3 2.3M6.9 17.7l-2.3 2.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>',
  hint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21.4h4M12 2.6a6 6 0 0 0-3.6 10.8c.6.5.9 1.2 1 1.9h5.2c.1-.7.4-1.4 1-1.9A6 6 0 0 0 12 2.6z"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4h9.6a5.4 5.4 0 0 1 0 10.8H8"/><path d="M7.6 4.8L4 8.4l3.6 3.6"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.6" y="4.6" width="4" height="14.8" rx="1.6"/><rect x="13.4" y="4.6" width="4" height="14.8" rx="1.6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2l11 6.8-11 6.8z"/></svg>',
  brush:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M15.4 3.6l5 5-8.6 8.6-5-5z"/><path d="M6.8 12.2L3.4 20.6l8.4-3.4" stroke-linecap="round"/></svg>',
  eraser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M8.4 19.4L4.6 15.6a1.6 1.6 0 0 1 0-2.3L13 4.9a1.6 1.6 0 0 1 2.3 0l3.8 3.8a1.6 1.6 0 0 1 0 2.3l-8.4 8.4H8.4z"/><path d="M19.4 19.4H9"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 6.6h14M9.4 6.6V4.8h5.2v1.8M6.8 6.6l.8 13h8.8l.8-13"/></svg>',
  levels:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.4" y="3.4" width="17.2" height="17.2" rx="3.4"/><path d="M3.4 9.6h17.2M9.6 9.6v11"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4.6h6.4a2 2 0 0 1 2 2v13a1.6 1.6 0 0 0-1.6-1.6H4zM20 4.6h-6.4a2 2 0 0 0-2 2v13a1.6 1.6 0 0 1 1.6-1.6H20z"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke-linejoin="round"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',
  skin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.8-1.8 0-.6-.3-1-.6-1.4-.3-.4-.6-.8-.6-1.4 0-.9.8-1.6 1.7-1.6H16A5 5 0 0 0 21 9c0-3.4-4-6-9-6z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6l1.5 2.6 3-.4.6 3 2.6 1.5-1.5 2.6 1.5 2.6-2.6 1.5-.6 3-3-.4L12 21.4l-1.5-2.6-3 .4-.6-3L4.3 14.7 5.8 12 4.3 9.4l2.6-1.5.6-3 3 .4z" stroke-linejoin="round"/></svg>'
};

const S={ phase:'ready',           // ready | play | paint | over  ← 上下文条的驱动器
  theme:'cozy_salt',
  set:{ripple:true,hover:true,keyhint:true,sound:true,autosave:true,conflict:false,
       confirmRestart:true,noguess:false,scale:'125%'},
  rows:9,cols:9,mines:10, board:[],open:[],flag:[],started:false,over:false,placed:false,
  elapsed:0,t0:0,timer:null,history:[],hintUsed:0,boomIdx:-1,
  variant:'经典', variantDesc:'无额外约束，标准扫雷推理', sizeLabel:'9×9' };
let fresh=[], cursor=-1, brush='中', paintColor='#c92a16';

/* =========================================================================
   1) L1 数据层 + L0 棋盘
   ========================================================================= */
function nb(i){const r=Math.floor(i/S.cols),c=i%S.cols,o=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;
    const rr=r+dr,cc=c+dc;if(rr>=0&&rr<S.rows&&cc>=0&&cc<S.cols)o.push(rr*S.cols+cc);}
  return o}
function newGame(){
  const N=S.rows*S.cols;
  S.board=new Array(N).fill(0);S.open=new Array(N).fill(false);S.flag=new Array(N).fill(false);
  S.over=false;S.started=false;S.placed=false;S.elapsed=0;S.history=[];S.hintUsed=0;S.boomIdx=-1;
  fresh=[];cursor=-1;S.phase='ready';
  $('#hintbar').classList.remove('off');
  $('#resultbar').classList.remove('on');
  $('#pet').className='pet calm';
  render();readouts();ctx();round();fitCell();
}
/* ★ 首点必不踩雷（沿用已验证逻辑，一字未改） */
function placeMines(safe){
  const N=S.rows*S.cols;
  const banned=new Set([safe,...nb(safe)]);
  const pool=[];for(let i=0;i<N;i++) if(!banned.has(i)) pool.push(i);
  for(let i=pool.length-1;i>0;i--){const j=rnd(i+1),t=pool[i];pool[i]=pool[j];pool[j]=t}
  pool.slice(0,S.mines).forEach(i=>S.board[i]=-1);
  for(let i=0;i<N;i++) if(S.board[i]!==-1) S.board[i]=nb(i).filter(j=>S.board[j]===-1).length;
  S.placed=true;
}
let cellPx=60;
/* 只按"此刻挂着的附加元素"扣高度：提示条与结果带不同时出现，
   所以对局中棋盘能吃到满尺寸（这是本方案相对旧架构的主要收益来源）。 */
function fitCell(){
  const z=$('.boardzone');if(!z)return;
  let chrome=0;
  if(!$('#hintbar').classList.contains('off')) chrome+=30;
  if($('#resultbar').classList.contains('on')) chrome+=54;
  const avail=Math.min(z.clientWidth,z.clientHeight);
  cellPx=Math.max(14,Math.floor((avail-chrome-22)/9));
  $('#app').style.setProperty('--cell',cellPx+'px');
}
function render(){
  const g=$('#grid');g.innerHTML='';
  const nf=new Set(fresh);let k=0;
  for(let i=0;i<S.rows*S.cols;i++){
    const d=el('div','tile');d.dataset.i=i;
    if(S.open[i]){
      d.classList.add('open');const v=S.board[i];
      if(v===-1){d.classList.add('mine');if(i===S.boomIdx)d.classList.add('boomhit');d.innerHTML=ICON.mine}
      else if(v>0){d.classList.add('t'+v);d.textContent=v}
      if(nf.has(i)){d.classList.add('pop');d.style.animationDelay=(k*14)+'ms';k++}
    }else if(S.flag[i]){d.style.color='var(--danger)';d.innerHTML=ICON.flag}
    if(i===cursor)d.classList.add('cur');
    g.appendChild(d);
  }
  fresh=[];
  g.onclick=e=>{const t=e.target.closest('.tile');if(t)clickCell(+t.dataset.i)};
  g.oncontextmenu=e=>{e.preventDefault();const t=e.target.closest('.tile');if(t)toggleFlag(+t.dataset.i)};
  g.onmouseover=e=>{const t=e.target.closest('.tile');if(!t||!S.set.hover)return;
    clearHl();t.classList.add('hl');
    nb(+t.dataset.i).forEach(j=>$(`.tile[data-i="${j}"]`)?.classList.add('hl'))};
  g.onmouseleave=clearHl;
}
function clearHl(){$$('.tile.hl').forEach(e=>e.classList.remove('hl'))}
function dismissHint(){const h=$('#hintbar');if(h&&S.started){h.classList.add('off');fitCell();}}
function pushHistory(){S.history.push({open:S.open.slice(),flag:S.flag.slice(),over:S.over,boomIdx:S.boomIdx});}

function clickCell(i){
  if(S.over)return;
  if(S.open[i]){chord(i);return}
  if(S.flag[i])return;
  if(!S.placed)placeMines(i);
  if(!S.started){S.started=true;S.phase='play';cursor=i;startTimer();dismissHint();ctx();setPet('tight')}
  pushHistory();openFlood(i);afterChange();
}
function chord(i){
  const v=S.board[i];if(!S.placed||v<=0)return;
  const nbs=nb(i);
  if(nbs.filter(j=>S.flag[j]).length!==v)return;
  const hidden=nbs.filter(j=>!S.flag[j]&&!S.open[j]);
  if(!hidden.length)return;
  pushHistory();hidden.forEach(j=>openFlood(j));afterChange();
}
function openFlood(i){
  if(S.board[i]===-1){
    S.over=true;S.phase='over';stopTimer();S.boomIdx=i;S.open[i]=true;
    for(let k=0;k<S.rows*S.cols;k++) if(S.board[k]===-1) S.open[k]=true;
    return;
  }
  const st=[i],got=[];
  while(st.length){const k=st.pop();if(S.open[k]||S.flag[k])continue;S.open[k]=true;got.push(k);
    if(S.board[k]===0)nb(k).forEach(j=>{if(!S.open[j]&&!S.flag[j])st.push(j)})}
  fresh.push(...got);
}
function afterChange(){
  if(S.over){render();readouts();ctx();setPet('sad');resultBar(false);return}
  if(S.open.filter(Boolean).length>=S.rows*S.cols-S.mines){
    S.over=true;S.phase='over';stopTimer();
    for(let i=0;i<S.rows*S.cols;i++) if(S.board[i]===-1&&!S.flag[i]) S.flag[i]=true;
    render();readouts();ctx();setPet('happy');resultBar(true);return;
  }
  render();readouts();ctx();
}
/* ★ 结算不再是弹窗：结果带出现在棋盘下方，盘面保持可见 → 能复盘 */
function resultBar(win){
  $('#rsBig').textContent=win?'胜利！':'失败';
  $('#rsBig').className='big '+(win?'win':'lose');
  $('#rsMeta').textContent=`用时 ${fmt(S.elapsed)} · 翻开 ${S.open.filter(Boolean).length} 格 · 提示 ${S.hintUsed} 次`;
  setTimeout(()=>{$('#resultbar').classList.add('on');fitCell()}, win?420:560);
}
function setPet(cls){$('#pet').className='pet '+cls}
function toggleFlag(i){
  if(S.open[i]||S.over)return;
  if(!S.started){S.started=true;S.phase='play';startTimer();dismissHint();ctx();setPet('tight')}
  S.flag[i]=!S.flag[i];render();readouts();ctx();
}
function hint(){
  if(S.over)return;
  if(!S.placed){toast('先点一下棋盘，再要提示');return}
  const i=S.open.findIndex((o,k)=>!o&&!S.flag[k]&&S.board[k]>=0);
  if(i<0)return;
  S.hintUsed++;cursor=i;render();
  $(`.tile[data-i="${i}"]`)?.classList.add('hl');toast('提示：高亮格必安全');
  setTimeout(()=>{if(!S.over)clickCell(i)},340);
}
function undo(){
  if(!S.history.length){toast('没有可撤销的步骤');return}
  const h=S.history.pop();
  S.open=h.open;S.flag=h.flag;S.over=h.over;S.boomIdx=h.boomIdx;
  if(!S.over){S.phase=S.started?'play':'ready';$('#resultbar').classList.remove('on');fitCell();}
  if(S.started&&!S.timer)startTimer();
  render();readouts();ctx();round();toast('已撤销一步');
}
function readouts(){
  const f=S.flag.filter(Boolean).length, rem=S.mines-f;
  const mc=$('#mineCount');mc.textContent=rem;mc.style.color=rem<0?'var(--danger)':'';
  const total=S.rows*S.cols, opened=S.open.filter(Boolean).length, goal=total-S.mines;
  $('#timeText').textContent=fmt(S.elapsed);
  $('#progText').textContent=opened+'/'+goal;
  $('#progFill').style.width=(goal?opened/goal*100:0)+'%';
  const dd=Math.max(0,goal-opened);
  $('#deducible').textContent=Math.min(9,Math.floor(dd/8));
}
function startTimer(){S.t0=Date.now()-S.elapsed*1000;clearInterval(S.timer);

function ctx(){
  const bar=$('#ctxbar');bar.innerHTML='';
  const add=(html,fn,cls='')=>{const b=el('button','act '+cls,html);if(fn)b.onclick=fn;bar.appendChild(b);return b};
  const lead=(t)=>{bar.appendChild(el('span','lead',t))};

  if(S.phase==='ready'){
    lead('还没开始 ·');
    add('随机一关',()=>{newGame();toast('已随机一局')},'primary');
    add(ICON.brush+'绘画',()=>{S.phase='paint';ctx()});
    add(ICON.book+'看规则',()=>openRight());
    add(ICON.gear+'设置',()=>openRight('设置'));
  }else if(S.phase==='play'){
    lead('进行中 ·');
    add(ICON.hint+'提示 <kbd>H</kbd>',hint);
    const u=add(ICON.undo+'撤销 <kbd>⌘Z</kbd>'+(S.history.length?` <span class="cnt">${S.history.length}</span>`:''),undo);
    if(!S.history.length)u.setAttribute('disabled','');
    add(ICON.brush+'绘画',()=>{S.phase='paint';ctx()});
    add(ICON.play+'暂停 <kbd>Esc</kbd>',pause);
    add(ICON.book+'本局规则',()=>openRight());
  }else if(S.phase==='paint'){
    lead('绘画 ·');
    ['#c92a16','#3471a1','#1f5c40','#8a5a3c','#444d5b','#7a4b96','#d4a017'].forEach((c,i)=>{
      const s=el('div','sw');s.style.background=c;s.tabIndex=0;
      s.setAttribute('aria-pressed',String(c===paintColor));
      s.onclick=()=>{paintColor=c;ctx()};bar.appendChild(s);
    });
    bar.appendChild(el('span','rdbar-sep'));
    const seg=el('div','seg');['细','中','粗'].forEach(v=>
      {const b=el('button','',v);b.setAttribute('aria-pressed',String(v===brush));
       b.onclick=()=>{brush=v;ctx()};seg.appendChild(b)});
    bar.appendChild(seg);
    bar.appendChild(el('span','rdbar-sep'));
    add(ICON.eraser+'橡皮',()=>toast('橡皮：再点切「擦整条/擦局部」'));
    add(ICON.trash+'清空',()=>confirmDlg('清除全部绘画？','此操作可撤销',()=>toast('已清除（占位）')));
    add('退出绘画',()=>{S.phase=S.started?'play':'ready';ctx()},'primary');
  }else if(S.phase==='over'){
    lead('本局结束 ·');
    add('再来一局',()=>newGame(),'primary');
    add('换一关',()=>goPage('levels'));
    add(ICON.book+'看规则',()=>openRight());
    add('看盘面',()=>$('#resultbar').classList.remove('on'));
  }
  // 常驻右端：导航入口（不占顶栏）
  bar.appendChild(el('span','rdbar-spacer'));
  const nav=el('button','act',ICON.levels+'导航');nav.onclick=openLeft;bar.appendChild(nav);
}

  m.classList.add('on');
}
let _cf=null,_pauseMode=false;
function confirmDlg(t,s,ok){$('#cfTitle').textContent=t;$('#cfSub').textContent=s;$('#cfOk').textContent='确定';
  $('#cfOk').className='act danger';_cf=ok;openModal('mConfirm')}
function openModal(id){closeAll(false);$('#scrim').classList.add('on');$('#'+id).classList.add('on')}
$('#cfOk').onclick=()=>{closeAll();_cf&&_cf()};
$('#rsAgain').onclick=()=>newGame();
$('#rsNext').onclick=()=>{newGame();goPage('levels')};
$('#rsReview').onclick=()=>$('#resultbar').classList.remove('on');

/* =========================================================================
   6) 键盘（沿用已验证映射 + Esc 分层返回）
   ========================================================================= */
addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='escape'){
    if($$('.panel.on').length||$$('.modal.on').length||$('#pv').classList.contains('on')) closeAll();
    else if(S.phase==='paint'){S.phase=S.started?'play':'ready';ctx()}
    else if(!S.over) pause();
    return;
  }
  if(e.target.classList&&e.target.classList.contains('sw-inline')&&(k===' '||k==='enter')){
    e.preventDefault();e.target.click();return}
  if($('#pv').classList.contains('on')) return;
  const cur=cursor<0?0:cursor;
  const map={'arrowup':-S.cols,'w':-S.cols,'arrowdown':S.cols,'s':S.cols,
             'arrowleft':-1,'a':-1,'arrowright':1,'d':1};
  if(map[k]!==undefined){
    e.preventDefault();
    if(cursor<0){cursor=0;render();return}
    const r=Math.floor(cursor/S.cols),c=cursor%S.cols;let nr=r,nc=c;
    if(map[k]===-S.cols)nr=Math.max(0,r-1);else if(map[k]===S.cols)nr=Math.min(S.rows-1,r+1);
    else if(map[k]===-1)nc=Math.max(0,c-1);else nc=Math.min(S.cols-1,c+1);
    cursor=nr*S.cols+nc;render();return;
  }
  if(cursor>=0&&k==='f'){e.preventDefault();toggleFlag(cursor);return}
  if(k==='enter'||(k===' '&&cursor>=0)){
    e.preventDefault(); if(cursor<0){cursor=0;render()}else clickCell(cursor); return;
  }
  if(k==='h')hint();
  else if(k==='b'){ if(S.phase!=='paint'){S.phase='paint';ctx()} else {S.phase=S.started?'play':'ready';ctx()} }
  else if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();undo()}
});

/* =========================================================================
   7) 启动
   ========================================================================= */
buildNav();newGame();setTheme('cozy_salt');ctx();
addEventListener('resize',()=>{fitCell();render()});
</script>
